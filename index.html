<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fila">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Fila</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f2f7; --blob1:rgba(255,138,76,.22); --blob2:rgba(120,140,255,.14);
  --ink:#0b0b0f; --ink2:#3c3c43; --muted:rgba(60,60,67,.62); --line:rgba(60,60,67,.14);
  --card:rgba(255,255,255,.72); --card-solid:#fff;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78);
  --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.04);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --accent:#f2622e; --accent-soft:rgba(242,98,46,.14); --on-accent:#fff;
  --ok:#248a3d; --warn:#b25000; --bad:#d70015; --ever:#3634a3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --blob1:rgba(255,110,50,.22); --blob2:rgba(90,110,255,.18);
  --ink:#f5f5f7; --ink2:#ebebf5; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.5);
  --card:rgba(28,28,30,.72); --card-solid:#1c1c1e;
  --glass:rgba(40,40,44,.52); --glass-strong:rgba(44,44,48,.78);
  --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  --hi:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.2);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --accent:#ff7a45; --accent-soft:rgba(255,122,69,.18); --on-accent:#1a0a03;
  --ok:#30d158; --warn:#ffb340; --bad:#ff6961; --ever:#a5a4ff;
}}
:root[data-theme="dark"]{
  --bg:#000; --blob1:rgba(255,110,50,.22); --blob2:rgba(90,110,255,.18);
  --ink:#f5f5f7; --ink2:#ebebf5; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.5);
  --card:rgba(28,28,30,.72); --card-solid:#1c1c1e;
  --glass:rgba(40,40,44,.52); --glass-strong:rgba(44,44,48,.78);
  --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  --hi:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.2);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --accent:#ff7a45; --accent-soft:rgba(255,122,69,.18); --on-accent:#1a0a03;
  --ok:#30d158; --warn:#ffb340; --bad:#ff6961; --ever:#a5a4ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
html{background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60vmax 50vmax at 100% -10%, var(--blob1), transparent 60%),
    radial-gradient(50vmax 50vmax at -10% 40%, var(--blob2), transparent 60%),
    var(--bg);
  background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Liquid glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:.5px solid var(--glass-edge);box-shadow:var(--hi),var(--glass-shadow)}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 20px 10px;transition:background .25s,box-shadow .25s}
header.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:0 .5px 0 var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.01em;margin:0;transition:font-size .2s}
header.scrolled h1{font-size:22px}
.sub{color:var(--muted);font-size:15px;margin-top:3px}
header.scrolled .sub{display:none}
.hbtns{display:flex;gap:8px;padding-bottom:2px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:var(--ink)}
.round.accent{background:var(--accent);color:var(--on-accent);border:0;box-shadow:0 6px 18px rgba(242,98,46,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.round:active,.btn:active,.tabbar button:active{transform:scale(.94)}
#filterbar{max-width:980px;margin:0 auto}

/* ---------- Layout ---------- */
main{padding:6px 16px calc(120px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.section-title{font-size:20px;font-weight:700;margin:22px 4px 10px}

/* ---------- Floating tab bar ---------- */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(14px, calc(env(safe-area-inset-bottom) - 6px));
  width:min(calc(100% - 28px),460px);height:68px;border-radius:34px;display:flex;align-items:center;padding:6px;gap:2px}
.tabbar button{flex:1;height:56px;border:0;background:none;border-radius:28px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;position:relative;transition:color .2s,background .2s;cursor:pointer}
.tabbar button svg.i{width:25px;height:25px}
.tabbar button.on{color:var(--accent);background:var(--fill)}
.tabbar .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------- Filters ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 2px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;border:.5px solid var(--glass-edge);background:var(--glass-strong);border-radius:18px;padding:0 14px;font-size:15px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--hi)}
.chip.on{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
select.chip{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- Cards ---------- */
.card{background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:.5px solid var(--glass-edge);box-shadow:var(--hi),0 1px 3px rgba(0,0,0,.04);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-top{display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:start}
.art{width:80px;height:80px;border-radius:16px;object-fit:cover;background:var(--fill);box-shadow:0 4px 14px rgba(0,0,0,.14)}
.card .show{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-size:17px;font-weight:600;line-height:1.28;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);align-items:center}
.pill{border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink2)}
.pill.fresh{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.old{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.ever{color:var(--ever);background:color-mix(in srgb,var(--ever) 13%,transparent)}
.pill.yt{color:#fff;background:#ff0033}
/* ---------- barra única, folha de filtros, compacto, arquivo ---------- */
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 0 2px}
.toolbar select.chip{max-width:34%;min-width:0;flex:0 1 auto;text-overflow:ellipsis}
.toolbar .chip{padding-left:11px;padding-right:11px;flex-shrink:0}
.toolbar select.chip{padding-right:26px}
.seg-b{width:32px}
.chip.small{height:30px;font-size:13px;padding:0 10px}
.chip .n{opacity:.6;font-weight:500;margin-left:2px}
.chip svg.i{width:16px;height:16px}
.seg{display:flex;border-radius:18px;padding:3px;gap:2px}
.seg-b{width:36px;height:30px;border:0;background:none;border-radius:14px;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.seg-b svg.i{width:18px;height:18px}
.seg-b.on{background:var(--accent);color:var(--on-accent)}
.round.small{width:36px;height:36px}
.round.small svg.i{width:18px;height:18px}
#fsheet{max-height:80vh;display:flex;flex-direction:column}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.fs-scroll{overflow-y:auto;margin:6px -4px 0;padding:0 4px}
.fs-l{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.card.dense{flex-direction:row;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:18px}
.card.dense .art{width:52px;height:52px;border-radius:11px;flex:none}
.dense-t{flex:1;min-width:0;cursor:pointer}
.card.dense .title{font-size:15px;margin:0 0 3px;-webkit-line-clamp:2}
.card.dense .meta{font-size:13px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.show-s{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.dot-v{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot-v.fresh{background:var(--ok)}.dot-v.soon{background:var(--warn)}.dot-v.old{background:var(--bad)}
.mini-p{font-size:10px;padding:1px 5px}
.grid.densegrid{gap:8px}
.reasons{display:flex;flex-direction:column;gap:8px}
.reason-b{text-align:left;border:0;background:var(--fill);border-radius:14px;padding:13px 16px;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer}
.reason-b:active{background:var(--accent-soft)}
.pill.reason{background:var(--accent-soft);color:var(--accent)}
.sw{position:relative;border-radius:24px;min-width:0;overflow:hidden}
.sw > .card{width:100%}
.sw-bg{position:absolute;inset:0;border-radius:24px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:700;font-size:15px;color:#fff;opacity:0;transition:opacity .15s}
.sw.go-r .sw-bg{opacity:1;background:#2f8a4f}.sw.go-l .sw-bg{opacity:1;background:#c2410c}
.sw.go-r .sw-l,.sw.go-l .sw-r{visibility:hidden}
.sw.armed .sw-bg span{transform:scale(1.12)}
.sw-bg span{transition:transform .15s}
.sw > .card{position:relative;will-change:transform}
.sw.go-r > .card,.sw.go-l > .card{background:var(--card-solid)}
.prog{color:var(--accent);font-weight:600}
.day{border-radius:24px;padding:16px;margin:8px 0 6px}
.day-h{display:flex;justify-content:space-between;align-items:flex-start}
.day-h .gt{font-size:22px;font-weight:700}
.day .li .t{cursor:pointer}
.archive-link{display:flex;align-items:center;gap:12px;width:100%;margin:22px 0 4px;padding:14px 16px;border-radius:20px;text-align:left;cursor:pointer;color:var(--ink);font-size:16px}
.archive-link span{flex:1}
.archive-link small{color:var(--muted);font-size:13px}
.archive-link svg.i{color:var(--muted)}
.why{font-size:13px;font-weight:600;color:var(--accent);margin:-2px 0 6px;line-height:1.3}
.group{margin:8px 0 22px}
.group-h{display:flex;justify-content:space-between;align-items:flex-end;margin:0 4px 10px}
.group-h .gt{font-size:20px;font-weight:700}
.group-h .sub{margin:2px 0 0;font-size:14px}
.art{object-position:center}
.actions{display:flex;gap:8px;align-items:center}
.actions .scroll{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
.actions .scroll::-webkit-scrollbar{display:none}
.btn{height:40px;border:0;background:var(--fill);border-radius:20px;padding:0 14px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer;text-decoration:none;color:var(--ink);flex:none}
.btn svg.i{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(242,98,46,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn.quiet{background:none;color:var(--muted);padding:0 8px}
.btn.small{height:34px;font-size:14px;padding:0 12px}
.desc{font-size:15px;color:var(--ink2);line-height:1.45;white-space:pre-line}
.more{display:flex;flex-direction:column;gap:10px;border-top:.5px solid var(--line);padding-top:12px}

/* ---------- Panels & lists ---------- */
.panel{background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:.5px solid var(--glass-edge);box-shadow:var(--hi);border-radius:24px;padding:16px}
.panel h3{margin:0;font-size:20px;font-weight:700}
.panel .sub{margin:4px 0 0}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:.5px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t .a{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t .b{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li img{width:52px;height:52px;border-radius:11px;object-fit:cover;background:var(--fill)}
.num{width:26px;text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.mini:disabled{opacity:.3}
.mini svg.i{width:17px;height:17px}
input[type=text],input[type=url],input[type=password]{width:100%;height:48px;font-size:17px;padding:0 16px;border-radius:14px;border:0;background:var(--fill);color:var(--ink);outline:none}
input:focus{box-shadow:0 0 0 2px var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
.feedurl{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--muted);background:var(--fill);padding:10px 12px;border-radius:12px;margin-top:10px}
details summary{cursor:pointer;color:var(--accent);font-size:16px;font-weight:600;list-style:none;margin-top:12px}
details summary::-webkit-details-marker{display:none}
.hint{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.45}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:20px}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff9a5a,var(--accent))}
.bar .n{color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- Empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px 20px;gap:10px}
.empty .ico{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;color:var(--accent);margin-bottom:6px}
.empty .ico svg.i{width:40px;height:40px;stroke-width:1.6}
.empty h2{font-size:22px;margin:0}
.empty p{color:var(--muted);margin:0;max-width:340px;font-size:16px;line-height:1.45}
.empty .row{justify-content:center;flex-wrap:wrap}

/* ---------- Sheet & toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:50%;bottom:max(14px, env(safe-area-inset-bottom));width:min(calc(100% - 20px),520px);border-radius:32px;padding:20px;transform:translate(-50%,130%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:translate(-50%,0)}
.sheet h3{margin:0 0 4px;font-size:22px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:50;padding:12px 18px;border-radius:22px;font-size:15px;font-weight:600;max-width:92vw;transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <div style="min-width:0"><h1 id="h-title">Fila</h1><div class="sub" id="h-sub">&nbsp;</div></div>
    <div class="hbtns">
      <button class="round glass" id="btn-dense" data-act="dense" aria-label="Alternar visão compacta"></button>
      <button class="round accent" id="btn-add" aria-label="Mandar episódio"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div id="filterbar"></div>
</header>
<main id="main"></main>

<nav class="tabbar glass" id="tabs">
  <button data-tab="inbox"><svg class="i" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg>Inbox<span id="cnt-inbox"></span></button>
  <button data-tab="queue"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h7"/><path d="M17 15.5v5l4-2.5z" fill="currentColor"/></svg>Fila</button>
  <button data-tab="watch"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3.5"/><path d="M9 6l.7-3h4.6l.7 3M9 18l.7 3h4.6l.7-3M12 9.5V12l1.5 1.5"/></svg>Watch</button>
  <button data-tab="done"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg>Ouvidos</button>
  <button data-tab="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg>Ajustes</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet">
  <h3>Mandar pra Fila</h3>
  <div class="sub">Cole o link de um episódio do Apple Podcasts ou de um vídeo do YouTube.</div>
  <div class="row"><input type="url" id="add-url" placeholder="https://podcasts.apple.com/…?i=…" autocomplete="off"></div>
  <div class="row"><button class="btn quiet" id="sheet-cancel">Cancelar</button><div style="flex:1"></div><button class="btn" id="sheet-paste">Colar</button><button class="btn primary" id="sheet-send">Mandar</button></div>
</div>
<div class="sheet glass" id="fsheet"></div>
<div class="toast glass" id="toast"></div>

<script>
const API = "https://khevvlkznbewbktlmryt.supabase.co/functions/v1/fila";
const LS = {
  get(k, d) { try { const v = localStorage.getItem("fila:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

async function api(path, body) {
  const r = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "x-fila-token": LS.get("token", ""), "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const out = await r.json().catch(() => ({}));
  if (r.status === 401) { state.needToken = true; render(); throw new Error("Esse app ainda não está conectado"); }
  if (!r.ok || out.ok === false) throw new Error(out.error || "Erro " + r.status);
  return out;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }

async function load() {
  if (!LS.get("token", "")) { state.needToken = true; render(); return; }
  state.needToken = false;
  try {
    const [eps, lists, shows, config, stats] = await Promise.all([api("/episodes"), api("/lists"), api("/shows"), api("/config"), api("/stats")]);
    Object.assign(state, { episodes: eps, lists, shows, config, stats, loaded: true });
  } catch (e) { toast(e.message); }
  render();
}

// ---------- helpers ----------
const DAY = 86400000;
function ago(d) {
  if (!d) return "?";
  const days = Math.floor((Date.now() - new Date(d)) / DAY);
  if (days <= 0) return "Hoje"; if (days === 1) return "Ontem";
  if (days < 7) return `${days} dias atrás`; if (days < 60) return `${Math.round(days / 7)} sem atrás`;
  return new Date(d).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "2-digit" });
}
const mins = (s) => (s ? Math.round(s / 60) : null);
const fmtDur = (s) => { const m = mins(s); if (m == null) return "—"; return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : `${m} min`; };
// total longo: "61 dias 4h 12min"
function fmtLong(sec) {
  const t = Math.round((sec || 0) / 60), d = Math.floor(t / 1440), h = Math.floor((t % 1440) / 60), m = t % 60;
  if (d) return `${d.toLocaleString("pt-BR")} ${d === 1 ? "dia" : "dias"} ${h}h ${m}min`;
  if (h) return `${h}h ${m}min`;
  return `${m} min`;
}
const fmtHours = (m) => (m >= 60 ? `${(m / 60).toFixed(m >= 600 ? 0 : 1).replace(".", ",")}<small>h</small>` : `${m}<small>min</small>`);
function validity(e) {
  if (e.kind === "evergreen" || !e.expires_at) return { cls: "ever", label: "Não vence" };
  const left = (new Date(e.expires_at) - Date.now()) / DAY;
  if (left < 0) return { cls: "old", label: `Vencido` };
  if (left < (e.kind === "news" ? 1 : 5)) return { cls: "soon", label: `Vence em ${Math.max(1, Math.round(left))}d` };
  return { cls: "fresh", label: "Fresco" };
}
const DUR = [["", "Duração"], ["0-20", "Até 20 min"], ["20-45", "20–45 min"], ["45-90", "45–90 min"], ["90-999", "90+ min"]];
const AGE = [["", "Validade"], ["fresh", "Frescos"], ["soon", "Vencendo"], ["old", "Vencidos"], ["ever", "Não vencem"]];
const KIND_LABEL = { news: "Notícia · 3 dias", tech: "Tech · 3 semanas", evergreen: "Não vence" };
const LANG = { English: "Inglês", Portuguese: "Português", Spanish: "Espanhol" };

function applyFilters(list) {
  const f = state.f;
  const out = list.filter((e) => {
    if (f.theme && e.theme !== f.theme) return false;
    if (f.show && String(e.show_id) !== f.show) return false;
    if (f.lang && e.language !== f.lang) return false;
    if (f.dur) { const [a, b] = f.dur.split("-").map(Number); const m = mins(e.duration_sec) ?? 0; if (m < a || m >= b) return false; }
    if (f.age && validity(e).cls !== f.age) return false;
    return true;
  });
  const by = {
    smart: (a, b) => prio(b).score - prio(a).score,
    pub_desc: (a, b) => new Date(b.pub_date) - new Date(a.pub_date),
    pub_asc: (a, b) => new Date(a.pub_date) - new Date(b.pub_date),
    dur_asc: (a, b) => (a.duration_sec ?? 0) - (b.duration_sec ?? 0),
    dur_desc: (a, b) => (b.duration_sec ?? 0) - (a.duration_sec ?? 0),
    expiring: (a, b) => (a.expires_at ? new Date(a.expires_at) : Infinity) - (b.expires_at ? new Date(b.expires_at) : Infinity),
  }[f.sort];
  return out.sort(by);
}

// Barra única: ordem · filtros (folha) · visão · densidade. Filtros ativos aparecem como pílulas removíveis.
const SORTS = [["smart", "Recomendado"], ["pub_desc", "Mais novos"], ["pub_asc", "Mais antigos"], ["expiring", "Vencendo antes"], ["dur_asc", "Mais curtos"], ["dur_desc", "Mais longos"]];
function activeFilters() {
  const f = state.f, out = [];
  if (f.theme) out.push(["theme", f.theme]);
  if (f.dur) out.push(["dur", DUR.find((d) => d[0] === f.dur)?.[1]]);
  if (f.age) out.push(["age", AGE.find((d) => d[0] === f.age)?.[1]]);
  if (f.show) out.push(["show", state._showNames?.[f.show] || "Programa"]);
  if (f.lang) out.push(["lang", LANG[f.lang] || f.lang]);
  return out;
}
function filterBar(items, opts = {}) {
  if (!items.length) return "";
  state._filterItems = items;
  state._showNames = Object.fromEntries(items.map((e) => [String(e.show_id), e.show_title]));
  const f = state.f, act = activeFilters();
  const opt = (arr, cur) => arr.map(([v, l]) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`).join("");
  const seg = (k, icon, label) => `<button class="seg-b ${state.group === k ? "on" : ""}" data-group="${k}" aria-label="${label}" title="${label}">${icon}</button>`;
  return `
  <div class="toolbar">
    <select class="chip" data-f="sort">${opt(SORTS, f.sort)}</select>
    <button class="chip ${act.length ? "on" : ""}" data-act="open-filters">${I.filter}Filtros${act.length ? ` · ${act.length}` : ""}</button>
    <div style="flex:1"></div>
    ${opts.group ? `<div class="seg glass">${seg("list", I.rows, "Lista")}${seg("topic", I.topics, "Por assunto")}${seg("theme", I.grid, "Por tema")}</div>` : ""}
  </div>
  ${act.length ? `<div class="filters" style="padding-top:6px">${act.map(([k, l]) => `<button class="chip on small" data-clear="${k}">${esc(l)} ${I.x}</button>`).join("")}<button class="chip small" data-act="clear-filters">Limpar</button></div>` : ""}`;
}
function filterSheet() {
  const items = state._filterItems || [];

  const shows = [...new Map(items.map((e) => [String(e.show_id), e.show_title])).entries()]
    .map(([id, t]) => [id, t, count((e) => String(e.show_id) === id)]).sort((a, b) => b[2] - a[2]);
  const langs = [...new Set(items.map((e) => e.language).filter(Boolean))];
  const chips = (k, arr) => `<div class="wrap">${arr.map(([v, l, n]) => `<button class="chip ${f[k] === v ? "on" : ""}" data-set="${k}" data-v="${esc(v)}">${esc(l)}${n != null ? ` <span class="n">${n}</span>` : ""}</button>`).join("")}</div>`;

      ${langs.length > 1 ? `<div class="fs-l">Idioma</div>${chips("lang", [["", "Todos"], ...langs.map((l) => [l, LANG[l] || l])])}` : ""}
      <div class="fs-l">Programa</div>
      <select class="chip" data-f="show" style="width:100%">${[["", "Todos os programas", items.length], ...shows].map(([v, l, n]) => `<option value="${esc(v)}" ${f.show === v ? "selected" : ""}>${esc(l)} (${n})</option>`).join("")}</select>
    </div>
    <div class="row"><div style="flex:1"></div><button class="btn primary" data-act="close-filters">Ver ${applyFilters(items).length} episódios</button></div>`;
}

function inList(slug, id) { const l = state.lists.find((x) => x.slug === slug); return !!l?.fila_list_items?.some((i) => i.episode_id === id); }

function cardInner(e, mode) {
  const v = validity(e);
  const isYT = e.platform === "youtube";
  const listBtns = isYT || (!e.audio_url && e.platform !== "apple")
    ?`<a class="btn small" href="${esc(e.url || e.apple_url)}" target="_blank">${I.play}${isYT ? "Assistir no YouTube" : "Abrir"}</a>`
    : state.lists.map((l) => {
    const on = inList(l.slug, e.id);
    return `<button class="btn small ${on ? "on" : ""}" data-act="list" data-slug="${l.slug}" data-id="${e.id}">${on ? I.check : I.plus}${esc(l.title.replace("Fila · ", ""))}</button>`;
  }).join("");
  const actions = {
    inbox: `<div class="scroll"><button class="btn quiet" data-act="dismiss" data-id="${e.id}">${I.x}Descartar</button></div>
            <button class="btn primary" data-act="keep" data-id="${e.id}">${I.check}Manter</button>`,
    queue: `<div class="scroll">${listBtns}</div>
            <button class="btn primary" data-act="done" data-id="${e.id}">${I.check}Ouvi</button>`,
    done: e.notion_page_id
      ? `<div class="scroll"><span class="hint" style="margin:0">Ouvido ${ago(e.done_at).toLowerCase()}</span></div><a class="btn small" href="https://www.notion.so/${e.notion_page_id.replace(/-/g, "")}" target="_blank">${I.ext}Notion</a>`
      : `<div class="scroll"><span class="hint" style="margin:0">${esc(e.notion_error ? (/NOTION_TOKEN/.test(e.notion_error) ? "Notion ainda não conectado" : "Falhou ao enviar pro Notion") : "Ouvido " + ago(e.done_at).toLowerCase())}</span></div><button class="btn small" data-act="notion" data-id="${e.id}">Enviar pro Notion</button>`,
    archive: `<div class="scroll"><span class="pill reason">${esc(reasonLabel(e.archive_reason))}</span><span class="hint" style="margin:0 0 0 6px;align-self:center">${ago(e.archived_at).toLowerCase()}</span></div>
            <button class="btn small" data-act="restore" data-id="${e.id}">Restaurar</button>
            <button class="btn small primary" data-act="done" data-id="${e.id}">${I.check}Ouvi</button>`,
  }[mode];
  const open = state.open[e.id];
  // ---- visão compacta: uma linha, ação principal à direita, resto ao tocar ----
  if (state.dense && !open) {
    const quick = { inbox: ["keep", I.check, "Manter"], queue: ["done", I.check, "Ouvi"], archive: ["restore", I.restore, "Restaurar"] }[mode];
    return `<div class="card dense">
      <img class="art" src="${esc(e.artwork || "")}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="dense-t" data-act="toggle" data-id="${e.id}">
        <div class="title">${esc(e.title)}</div>
        <div class="meta"><span class="show-s">${esc(e.show_title || "")}</span><span>· ${fmtDur(e.duration_sec)}</span>${progress(e) ? `<span class="prog">${progress(e)}</span>` : ""}${mode === "queue" && v.cls !== "ever" ? `<span class="dot-v ${v.cls}" title="${v.label}"></span>` : ""}${isYT ? `<span class="pill yt mini-p">YT</span>` : ""}</div>
      </div>
      ${quick ? `<button class="round small ${mode === "queue" ? "accent" : "glass"}" data-act="${quick[0]}" data-id="${e.id}" aria-label="${quick[2]}">${quick[1]}</button>` : ""}
    </div>`;
  }
  return `<div class="card">
    <div class="card-top">
      <img class="art" src="${esc(e.artwork || "")}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div style="min-width:0">
        <div class="show">${esc(e.show_title)}</div>
        <div class="title" data-act="toggle" data-id="${e.id}">${esc(e.title)}</div>
        ${mode === "queue" && prio(e).why.length ? `<div class="why">${esc(prio(e).why.slice(0, 2).join(" · "))}</div>` : ""}
        <div class="meta">
          <span>${ago(e.pub_date)}</span><span>·</span><span>${fmtDur(e.duration_sec)}</span>${progress(e) ? `<span class="prog">${progress(e)}</span>` : ""}
        </div>
        <div class="meta" style="margin-top:6px">
          ${isYT ? `<span class="pill yt">YouTube</span>` : ""}
          <span class="pill">${esc(e.theme || "Sem tema")}</span>
          ${mode !== "done" ? `<span class="pill ${v.cls}">${v.label}</span>` : ""}
        </div>
      </div>
    </div>
    ${open ? `<div class="more">
        <div class="desc">${e.description === undefined ? "Carregando…" : esc((e.description || "Sem descrição.").slice(0, 900))}</div>
        <div class="filters" style="margin:0;padding:0">
          ${["news", "tech", "evergreen"].map((k) => `<button class="chip ${e.kind === k ? "on" : ""}" data-act="kind" data-kind="${k}" data-id="${e.id}">${KIND_LABEL[k]}</button>`).join("")}
        </div>
        <div class="filters" style="margin:0;padding:0">
          <select class="chip" data-act="theme" data-id="${e.id}">${(state.config.themes || []).map((t) => `<option ${t === e.theme ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
          <a class="chip" href="${esc(e.apple_url)}" target="_blank">Abrir na Apple ↗</a>
          ${mode === "queue" || mode === "inbox" ? `<button class="chip" data-act="archive" data-id="${e.id}">Arquivar</button><button class="chip" data-act="dismiss" data-id="${e.id}">Descartar</button>` : ""}
          ${state.dense ? `<button class="chip" data-act="toggle" data-id="${e.id}">Fechar</button>` : ""}
        </div>
        ${e.shelves?.length ? `<div class="hint" style="margin:0">Shelves: ${e.shelves.map(esc).join(", ")}</div>` : ""}
      </div>` : ""}
    <div class="actions">${actions}</div>
  </div>`;
}

// quanto já ouviu (vem do Apple Podcasts pelo Mac)
function progress(e) {
  if (!e.playhead_sec || !e.duration_sec) return "";
  const p = Math.min(99, Math.round((e.playhead_sec / e.duration_sec) * 100));
  return `${p}% · faltam ${fmtDur(e.duration_sec - e.playhead_sec)}`;
}

// ---- deslizar: → manda pra lista padrão (Hoje), ← arquiva (pede motivo). Na Inbox: → mantém, ← descarta ----
const SWIPE = {
  queue: { right: ["list", () => `+ ${listName(state.swipeList)}`], left: ["archive", () => "Arquivar"] },
  inbox: { right: ["keep", () => "Manter"], left: ["dismiss", () => "Descartar"] },
  archive: { right: ["restore", () => "Restaurar"], left: null },
};
function listName(slug) { return (state.lists.find((l) => l.slug === slug)?.title || slug || "Hoje").replace("Fila · ", ""); }
function card(e, mode) {
  const sw = SWIPE[mode];
  if (!sw) return cardInner(e, mode);
  return `<div class="sw" data-sid="${e.id}" data-mode="${mode}">
    <div class="sw-bg"><span class="sw-r">${sw.right ? esc(sw.right[1]()) : ""}</span><span class="sw-l">${sw.left ? esc(sw.left[1]()) : ""}</span></div>
    ${cardInner(e, mode)}
  </div>`;
}
(() => {
  let s = null;
  document.addEventListener("touchstart", (ev) => {
    const w = ev.target.closest(".sw"); if (!w || ev.touches.length > 1 || ev.target.closest("button,a,select,input")) return;
    s = { w, c: w.querySelector(".card"), x: ev.touches[0].clientX, y: ev.touches[0].clientY, dx: 0, lock: null };
  }, { passive: true });
  document.addEventListener("touchmove", (ev) => {
    if (!s) return;
    const dx = ev.touches[0].clientX - s.x, dy = ev.touches[0].clientY - s.y;
    if (s.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) s.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (s.lock !== "x") return;
    const sw = SWIPE[s.w.dataset.mode];
    if ((dx > 0 && !sw.right) || (dx < 0 && !sw.left)) return;
    ev.preventDefault();
    s.dx = dx;
    s.c.style.transition = "none";
    s.c.style.transform = `translateX(${dx}px)`;
    s.w.classList.toggle("go-r", dx > 0); s.w.classList.toggle("go-l", dx < 0);
    s.w.classList.toggle("armed", Math.abs(dx) > 90);
  }, { passive: false });
  document.addEventListener("touchend", async () => {
    if (!s) return;
    const { w, c, dx } = s; s = null;
    c.style.transition = "transform .25s cubic-bezier(.2,.9,.25,1)";
    if (Math.abs(dx) < 90) { c.style.transform = ""; w.classList.remove("go-r", "go-l", "armed"); return; }
    const sw = SWIPE[w.dataset.mode], [actName] = dx > 0 ? sw.right : sw.left, id = w.dataset.sid;
    if (actName !== "archive") { c.style.transform = `translateX(${dx > 0 ? 110 : -110}%)`; w.style.opacity = ".4"; }
    else { c.style.transform = ""; w.classList.remove("go-r", "go-l", "armed"); }

function affinity() {

  else if (v.cls === "fresh" && e.kind !== "evergreen") { s += 0.3; why.push(e.kind === "news" ? "Notícia fresca" : "Ainda atual"); }

// ---------- Seu dia: seleção curada e equilibrada ----------
// Regras: continua o que está pela metade; no máx. 1 por programa e 1 por assunto; no máx. 2 por tema;
// mistura durações (1 longo no máx., pelo menos 1 curto); para perto do tempo-alvo. Muda a cada dia.
const today = () => new Date().toISOString().slice(0, 10);
function daySeed(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0) / 4294967296); }
function dayPlan(all) {
  const target = (LS.get("dayTarget", 90)) * 60;
  const skip = new Set(LS.get(`daySkip:${today()}`, []));
  const rnd = daySeed(today() + skip.size);
  const pool = all.filter((e) => !skip.has(e.id) && validity(e).cls !== "old" && e.platform !== "youtube")
    .map((e) => ({ e, s: prio(e).score + rnd() * 0.25 + (e.status === "listening" ? 0.6 : 0) }))
    .sort((a, b) => b.s - a.s).map((x) => x.e);
  const picked = [], shows = new Set(), topics = new Set(), themes = {};
  let total = 0, long = 0, short = 0;
  const left = (e) => (e.playhead_sec ? Math.max(0, (e.duration_sec || 0) - e.playhead_sec) : e.duration_sec || 1800);
  const ok = (e, relax) => {
    const d = left(e), g = state._queueClusters?.map.get(e.id);
    if (shows.has(e.show_title)) return false;
    if (g && topics.has(g.label)) return false;
    if ((themes[e.theme] || 0) >= (relax ? 3 : 2)) return false;
    if (d > 75 * 60 && (long >= 1 || target < 100 * 60)) return false;
    if (total + d > target * 1.15) return false;
    return true;
  };

    const d = left(e), g = state._queueClusters?.map.get(e.id);
    picked.push(e); shows.add(e.show_title); if (g) topics.add(g.label);
    themes[e.theme] = (themes[e.theme] || 0) + 1; total += d; if (d > 75 * 60) long++; if (d < 25 * 60) short++;
  };
  for (const relax of [false, true]) for (const e of pool) { if (total >= target * 0.9) break; if (!picked.includes(e) && ok(e, relax)) add(e); }

}

        <img src="${esc(e.artwork || "")}" alt="" onerror="this.style.visibility='hidden'">
        <div class="t"><div class="a">${esc(e.title)}</div><div class="b">${esc(e.show_title)} · ${fmtDur(e.duration_sec)}</div></div>
        <button class="mini" aria-label="Subir" data-act="move" data-op="up" data-slug="${l.slug}" data-id="${e.id}" ${i === 0 ? "disabled" : ""}>${I.up}</button>
        <button class="mini" aria-label="Remover" data-act="move" data-op="remove" data-slug="${l.slug}" data-id="${e.id}">${I.x}</button>
      </div>`).join("") || `<div class="hint">Vazia. Na Fila, toque em “+ ${esc(name)}” nos episódios que quer levar.</div>`}
      </div>
      <details><summary>Assinar no Apple Podcasts</summary>
        <div class="feedurl">${esc(feed)}</div>
        <div class="row"><button class="btn" data-act="copy" data-text="${esc(feed)}">${I.copy}Copiar link</button>
        <a class="btn" href="${esc(feed.replace(/^https:/, "podcast:"))}">Abrir no Podcasts</a></div>
        <div class="hint">No Podcasts: Biblioteca → ••• → Seguir um programa por URL. Faça uma vez só e ligue “Baixar episódios” pra ir pro Watch.</div>
      </details>
    </div>`;
  }).join("") + `</div>`;
}

function viewSettings() {
  $("#filterbar").innerHTML = "";
  setSub("Programas, integrações e acesso");
  const c = state.config;
  const followed = state.shows.filter((s) => s.follow).length;
  return `<div class="grid">
  <div class="panel" style="grid-column:1/-1">
    <h3>Inbox automática</h3>
    <div class="sub">${followed ? `Seguindo ${followed} programa${followed > 1 ? "s" : ""}. O app checa os RSS a cada hora.` : "Cole o link de um programa do Apple Podcasts pra seguir."}</div>
    <div class="row"><input type="url" id="show-url" placeholder="https://podcasts.apple.com/br/podcast/…/id123"><button class="btn primary" data-act="follow">Seguir</button></div>
    <div style="margin-top:8px">
    ${state.shows.filter((s) => s.follow).map((s) => `<div class="li"><img src="${esc(s.artwork || "")}" alt=""><div class="t"><div class="a">${esc(s.title)}</div><div class="b">${esc(s.genre || "")}${s.last_polled_at ? " · lido " + ago(s.last_polled_at).toLowerCase() : ""}</div></div>
      <button class="btn small on" data-act="unfollow" data-id="${s.id}" data-follow="false">Seguindo</button></div>`).join("")}
    </div>
  </div>
  <div style="grid-column:1/-1">${suggestions(20, "Sugestões: o que você mais ouviu")}</div>
  <div class="panel">
    <h3>Integrações</h3>
    <div class="li"><div class="t"><div class="a">Notion · 📻 Podcasts</div><div class="b">${!c.notion ? "Falta o NOTION_TOKEN no Supabase" : c.notion_synced_at ? "Sincroniza nos dois sentidos · " + ago(c.notion_synced_at).toLowerCase() : c.notion_importing ? "Importação pela metade" : "Conectado · histórico ainda não importado"}</div></div><span class="pill ${c.notion ? "fresh" : "old"}">${c.notion ? "Conectado" : "Desligado"}</span></div>
    <div class="li"><div class="t"><div class="a">Apple Podcasts (via Mac)</div><div class="b">${c.apple_synced_at ? "Ouvidos, andamento, Salvos e programas seguidos · " + ago(c.apple_synced_at).toLowerCase() : "Ainda não sincronizado"}</div></div><span class="pill ${c.apple_synced_at ? "fresh" : "soon"}">${c.apple_synced_at ? "Ligado" : "Desligado"}</span></div>
    <div class="li"><div class="t"><div class="a">IA pra tema e Shelves</div><div class="b">${c.ai ? "Classifica cada episódio" : "Hoje usa o gênero da Apple"}</div></div><span class="pill ${c.ai ? "fresh" : "soon"}">${c.ai ? "Ligada" : "Básico"}</span></div>
    ${c.notion ? `<div class="row">${!c.notion_synced_at ? `<button class="btn primary" data-act="notion-import">${c.notion_importing ? "Continuar importação" : "Importar histórico do Notion"}</button>` : `<button class="btn" data-act="notion-import">Sincronizar agora</button>`}<button class="btn" data-act="shelves">Shelves</button></div><div class="hint" id="import-progress"></div>` : ""}  </div>
  <div class="panel">
    <h3>Aparência e acesso</h3>
    <div class="row"><select class="chip" id="theme-pick" style="flex:1"><option value="">Seguir o sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></div>
    <div class="hint">Deslizar pra direita na Fila manda pra:</div>
    <div class="row"><select class="chip" id="swipe-pick" style="flex:1">${state.lists.map((l) => `<option value="${l.slug}" ${state.swipeList === l.slug ? "selected" : ""}>${esc(l.title)}</option>`).join("")}</select></div>
    <div class="row"><input type="password" id="token" value="${esc(LS.get("token", ""))}" placeholder="Token de acesso"><button class="btn primary" data-act="save-token">Salvar</button></div>
  </div>
  </div>`;
}

function setSub(t) { $("#h-sub").textContent = t; }

function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === (state.tab === "archive" ? "queue" : state.tab)));
  const titles = { inbox: "Inbox", queue: "Fila", watch: "Watch", done: "Ouvidos", settings: "Ajustes", archive: "Arquivo" };
  $("#h-title").textContent = titles[state.tab];
  const nInbox = state.episodes.filter((e) => e.status === "inbox").length;
  $("#cnt-inbox").innerHTML = nInbox ? `<span class="dot">${nInbox > 99 ? "99+" : nInbox}</span>` : "";
  if (state.needToken) { $("#h-title").textContent = "Conectar"; $("#main").innerHTML = viewConnect(); return; }
  $("#main").innerHTML = ({ inbox: viewInbox, queue: viewQueue, done: viewDone, watch: viewWatch, settings: viewSettings, archive: viewArchive }[state.tab] || viewQueue)();
  $("#main").querySelectorAll(".grid").forEach((g) => g.classList.toggle("densegrid", state.dense));
  const db = $("#btn-dense"); db.innerHTML = state.dense ? I.expand : I.compact; db.title = state.dense ? "Visão normal" : "Visão compacta";
  db.style.display = ["queue", "inbox", "archive"].includes(state.tab) ? "" : "none";
  if ($("#fsheet").classList.contains("show") && $("#fsheet").querySelector(".fs-scroll")) $("#fsheet").innerHTML = filterSheet();
  const tp = $("#theme-pick"); if (tp) tp.value = LS.get("theme", "");
}

// ---------- add sheet ----------
function closeFilters() { $("#fsheet").classList.remove("show"); $("#scrim").classList.remove("show"); }
function openSheet(show) {
  if (!show) closeFilters();
  $("#sheet").classList.toggle("show", show); $("#scrim").classList.toggle("show", show);
  if (show) setTimeout(() => $("#add-url").focus(), 250); else $("#add-url").blur();
}
$("#btn-add").onclick = () => openSheet(true);
$("#scrim").onclick = $("#sheet-cancel").onclick = () => openSheet(false);
$("#sheet-paste").onclick = async () => { try { $("#add-url").value = await navigator.clipboard.readText(); } catch { toast("Cole com toque longo no campo"); } };
$("#sheet-send").onclick = async () => {
  const u = $("#add-url").value.trim(); if (!u) return;
  openSheet(false); toast("Buscando episódio…");
  try { const r = await api("/add", { url: u }); toast(r.message); $("#add-url").value = ""; state.tab = "queue"; LS.set("tab", "queue"); load(); }
  catch (e) { toast(e.message); }
};

// ---------- eventos ----------
function patchLocal(id, patch) { const e = state.episodes.find((x) => x.id === id); if (e) Object.assign(e, patch); }
async function act(el) {
  const { act: a, id, slug } = el.dataset;
  try {
    if (a === "toggle") {
      state.open[id] = !state.open[id]; render();
      const e = state.episodes.find((x) => x.id === id);
      if (state.open[id] && e && e.description === undefined) {
        const d = await api(`/episodes/${id}`); e.description = d.description || ""; render();
      }
      return;
    }
    if (a === "more") { state.limit = (state.limit || 60) + 60; return render(); }
    if (a === "more-group") { state.groupOpen = { ...(state.groupOpen || {}), [el.dataset.g]: true }; return render(); }
    if (a === "open-add") return openSheet(true);
    if (a === "clear-filters") { state.f = { theme: "", dur: "", show: "", age: "", sort: state.f.sort, lang: "" }; LS.set("filters", state.f); return render(); }
    if (a === "day-swap") { const k = `daySkip:${today()}`; LS.set(k, [...LS.get(k, []), id]); return render(); }
    if (a === "day-reroll") {
      const k = `daySkip:${today()}`; const cur = dayPlan(state.episodes.filter((e) => e.status === "queue" || e.status === "listening")).eps.map((e) => e.id);
      LS.set(k, [...LS.get(k, []), ...cur]); return render();
    }
    if (a === "toggle-day") { state.group = "list"; state.open[id] = true; render(); document.querySelector(`[data-sid="${id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    if (a === "day-send") {
      const d = dayPlan(state.episodes.filter((e) => e.status === "queue" || e.status === "listening"));
      el.disabled = true; toast("Montando a Fila · Hoje…");
      await api("/lists/hoje", { op: "clear" });
      let n = 0;
      for (const e of d.eps) {
        try { const r = await api("/lists/hoje", { episode_id: e.id, op: "add" }); n++; if (r.episode) patchLocal(e.id, { audio_url: r.episode.audio_url }); } catch (_) { /* sem áudio: pula */ }
      }
      state.lists = await api("/lists"); render();
      return toast(`${n} episódios na Fila · Hoje. Assine o feed na aba Watch.`);
    }
    if (a === "open-filters") { $("#fsheet").innerHTML = filterSheet(); $("#fsheet").classList.add("show"); $("#scrim").classList.add("show"); return; }
    if (a === "close-filters") { closeFilters(); return; }
    if (a === "dense") { state.dense = !state.dense; LS.set("dense", state.dense); state.open = {}; return render(); }
    if (a === "archive") {
      const e = state.episodes.find((x) => x.id === id);
      $("#fsheet").innerHTML = reasonSheet(e); $("#fsheet").classList.add("show"); $("#scrim").classList.add("show");
      return;
    }
    if (a === "reason-other") { $("#reason-other").style.display = "flex"; $("#reason-text").focus(); return; }
    if (a === "archive-reason") {
      let reason = el.dataset.reason;
      if (reason === "custom") { reason = $("#reason-text").value.trim(); if (!reason) return toast("Escreva o motivo"); }
      closeFilters();
      const e = state.episodes.find((x) => x.id === id); patchLocal(id, { status: "archived" }); render();
      await api(`/episodes/${id}`, { status: "archived", reason });
      if (state.stats) state.stats.archived = (state.stats.archived || 0) + 1;
      if (state.archive && e) state.archive.unshift({ ...e, status: "archived", archived_at: new Date().toISOString(), archive_reason: reason });
      return toast(`Arquivado · ${reasonLabel(reason)}`);
    }
    if (a === "restore") {
      const r = await api(`/episodes/${id}`, { restore: true });
      state.archive = (state.archive || []).filter((x) => x.id !== id);
      state.episodes.push(r.episode); if (state.stats) state.stats.archived = Math.max(0, (state.stats.archived || 1) - 1);
      render(); return toast("De volta na Fila por mais 7 dias");
    }
    if (a === "follow-id" || a === "follow-all") {
      const ids = a === "follow-id" ? [id] : (state.stats?.shows_365 || []).filter((s) => s.id && !s.follow).slice(0, Number(el.dataset.n || 10)).map((s) => String(s.id));
      el.disabled = true;
      for (const sid of ids) {
        await api("/shows", { id: Number(sid), follow: true });
        const s = state.stats?.shows_365?.find((x) => String(x.id) === sid); if (s) s.follow = true;
      }
      toast(ids.length > 1 ? `Seguindo ${ids.length} programas. Buscando episódios novos…` : "Seguindo. Buscando episódios novos…");
      await api("/refresh", {}).catch(() => {});
      return load();
    }
    if (a === "keep") { patchLocal(id, { status: "queue" }); render(); await api(`/episodes/${id}`, { status: "queue" }); return toast("Na Fila"); }
    if (a === "dismiss") { patchLocal(id, { status: "dismissed" }); render(); await api(`/episodes/${id}`, { status: "dismissed" }); return toast("Descartado"); }
    if (a === "dismiss-old") {
      const old = state.episodes.filter((e) => e.status === "inbox" && validity(e).cls === "old");
      old.forEach((e) => (e.status = "dismissed")); render();
      await Promise.all(old.map((e) => api(`/episodes/${e.id}`, { status: "dismissed" })));
      return toast(`${old.length} vencidos descartados`);
    }
    if (a === "done") {
      patchLocal(id, { status: "done", done_at: new Date().toISOString() }); render();
      const r = await api(`/episodes/${id}`, { status: "done" });
      patchLocal(id, r.episode); if (r.notion?.page_id) patchLocal(id, { notion_page_id: r.notion.page_id });
      state.lists.forEach((l) => (l.fila_list_items = (l.fila_list_items || []).filter((i) => i.episode_id !== id)));
      render();
      return toast(r.notion?.page_id ? "Ouvido · salvo no Notion" : "Ouvido · Notion pendente");
    }
    if (a === "notion") { const r = await api("/notion/retry", {}); toast(r.out.some((o) => o.page) ? "Enviado pro Notion" : (r.out[0]?.error || "Nada pendente")); return load(); }
    if (a === "list" || a === "move") {
      const op = a === "list" ? (inList(slug, id) ? "remove" : "add") : el.dataset.op;
      if (op === "add") toast("Preparando pro Watch…");
      const r = await api(`/lists/${slug}`, { episode_id: id, op });
      if (r.episode) patchLocal(id, { audio_url: r.episode.audio_url, artwork: r.episode.artwork });
      const l = state.lists.find((x) => x.slug === slug); l.fila_list_items = r.order.map((episode_id, position) => ({ episode_id, position }));
      render(); if (a === "list") toast(op === "add" ? `+ ${l.title.replace("Fila · ", "")}` : "Removido da lista"); return;
    }
    if (a === "kind") { await api(`/episodes/${id}`, { kind: el.dataset.kind }); return load(); }
    if (a === "copy") { await navigator.clipboard.writeText(el.dataset.text); return toast("Link copiado"); }
    if (a === "follow") {
      const u = $("#show-url").value.trim(); if (!u) return;
      const r = await api("/shows", { url: u, follow: true }); toast("Seguindo " + r.show.title);
      await api("/refresh", {}); return load();
    }
    if (a === "unfollow") { await api("/shows", { id: Number(id), follow: el.dataset.follow === "true" }); return load(); }
    if (a === "paste-token") { try { $("#token").value = (await navigator.clipboard.readText()).trim(); } catch { toast("Toque e segure no campo pra colar"); } return; }
    if (a === "more-done") { state.doneLimit = (state.doneLimit || 30) + 30; return render(); }
    if (a === "notion-import") {
      el.disabled = true; let ins = 0, upd = 0, round = 0;
      for (;;) {
        const r = await api("/notion/sync", { max: 8 });
        ins += r.inserted; upd += r.updated; round++;
        const p = $("#import-progress"); if (p) p.textContent = `Importando… ${ins.toLocaleString("pt-BR")} novos, ${upd} atualizados`;
        if (!r.has_more) break;
      }
      toast(`Notion: ${ins} importados, ${upd} atualizados`); return load();
    }
    if (a === "shelves") { const r = await api("/shelves/sync", {}); return toast(`${r.count} Shelves sincronizadas`); }
    if (a === "save-token") { LS.set("token", $("#token").value.trim()); state.tab = "queue"; LS.set("tab", "queue"); return load(); }
  } catch (e) { toast(e.message); load(); }
}
document.addEventListener("click", (ev) => {
  const go = ev.target.closest("[data-go]");
  if (go) { state.tab = go.dataset.go; LS.set("tab", state.tab); window.scrollTo(0, 0); return render(); }
  const t = ev.target.closest("[data-act]"); if (t && t.tagName !== "SELECT") { ev.preventDefault(); act(t); return; }
  const dt = ev.target.closest("[data-daytarget]");
  if (dt) { LS.set("dayTarget", Number(dt.dataset.daytarget)); return render(); }
  const ar = ev.target.closest("[data-areason]");
  if (ar) { state.archiveReason = ar.dataset.areason; state.limit = 60; return render(); }
  const st = ev.target.closest("[data-set]");
  if (st) { state.f[st.dataset.set] = st.dataset.v; LS.set("filters", state.f); state.limit = 60; return render(); }
  const cl = ev.target.closest("[data-clear]");
  if (cl) { state.f[cl.dataset.clear] = ""; LS.set("filters", state.f); return render(); }
  const gb = ev.target.closest("[data-group]");
  if (gb) { state.group = gb.dataset.group; LS.set("group", state.group); return render(); }
  const th = ev.target.closest(".chip[data-theme]");
  if (th) { state.f.theme = th.dataset.theme; LS.set("filters", state.f); render(); return; }
  const tab = ev.target.closest("#tabs button");
  if (tab) { state.tab = tab.dataset.tab; LS.set("tab", state.tab); window.scrollTo(0, 0); render(); }
});
document.addEventListener("change", async (ev) => {
  const s = ev.target;
  if (s.dataset.f) { state.f[s.dataset.f] = s.value; LS.set("filters", state.f); render(); }
  if (s.dataset.act === "theme") { patchLocal(s.dataset.id, { theme: s.value }); await api(`/episodes/${s.dataset.id}`, { theme: s.value }).catch((e) => toast(e.message)); render(); }
  if (s.id === "theme-pick") { LS.set("theme", s.value); applyTheme(); }
  if (s.id === "swipe-pick") { state.swipeList = s.value; LS.set("swipeList", s.value); toast(`Deslizar → ${listName(s.value)}`); }
});
window.addEventListener("scroll", () => $("#hdr").classList.toggle("scrolled", scrollY > 8), { passive: true });
function applyTheme() { const t = LS.get("theme", ""); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
render();
load();
</script>
</body>
</html>
